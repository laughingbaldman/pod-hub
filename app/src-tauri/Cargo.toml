[package]
name = "part-hub"
version = "0.1.0"
description = "Hub desktop client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "part_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
